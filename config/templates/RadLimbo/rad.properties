# RadLimbo Configuration (Minecraft 26.3 / protocol 777)
config-version=1

# Network and forwarding
server-ip=127.0.0.1
server-port=25566
forwarding-mode=none
forwarding-secret=change-me-radbyte-secret

# Status and waiting room gameplay
motd=RadLimbo 26.3 - Waiting Room
max-players=1000
view-distance=2
gamemode=spectator

# Spawn coordinates
spawn-x=0.5
spawn-y=64.0
spawn-z=0.5

# Messages and reconnect target
brand=RadLimbo
welcome-message=Welcome to RadLimbo! Waiting for a backend server...
reconnect-server=lobby
keep-alive-interval-secs=15
