# RadProxy Configuration (Minecraft 26.3 / protocol 777)
config-version=1

# Network and status
server-ip=0.0.0.0
server-port=25565
online-mode=false
motd=RadProxy 26.3
max-players=1000
enforce-max-players=false
ping-passthrough=none
sample-players-in-ping=false
favicon-path=server-icon.png

# Proxy forwarding and plugin channels
forwarding-mode=modern
forwarding-secret=change-me-radbyte-secret
proxy-brand=RadProxy
bungeecord-messaging=true

# Security and rate limits
handshake-timeout-ms=3000
connect-timeout-ms=3000
max-packet-size=65536
max-connections-per-ip=16
rate-limit-per-sec=25
kick-existing-players=true
white-list=false

# Routing and backend servers
default-server=limbo
try-servers=limbo
load-balance-strategy=least_players
server.limbo=127.0.0.1:25566
# server.lobby=127.0.0.1:25567

# Plugins (Radons)
radons-dir=radons
radonfigs-dir=radonfigs
