# RadByte-specific settings.

# Version
config-version=1

# Proxy forwarding
forwarding-mode=none
forwarding-secret=change-me-radbyte-secret

# Network limits and timeouts
login-timeout-secs=10
forwarding-timeout-secs=5
configuration-timeout-secs=10
play-read-timeout-secs=35

# Server tick and saving
tps=20
autosave-interval-secs=300

# World and spawn
world-type=flat
spawn-x=0.5
spawn-y=64.0
spawn-z=0.5

# Messages and lobby
brand=RadServer
welcome-message=Welcome to RadServer 26.3!
lobby-server=limbo
