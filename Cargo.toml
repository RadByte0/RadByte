[workspace]
resolver = "3"
members = [
    "RadAPI",
    "RadCore",
    "RadLimbo",
    "RadProxy",
    "RadServer",
    "RadTools",
    "RadVersions/common",
    "RadVersions/v26_3",
]

[workspace.package]
version = "0.5.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RadByte0/RadByte"

[workspace.dependencies]
aes = "0.8"
arc-swap = "1.7"
base64 = "0.22"
bytes = "1.10"
cfb8 = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
fastnbt = "2.6.3"
hmac = "0.12"
libloading = "0.8"
mimalloc = "0.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1.44", default-features = false, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["serde", "v3"] }
wasmi = "0.40"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
