[package]
name = "rad-version-26-3"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Loadable Minecraft Java 26.3 (protocol 777) version module (cdylib/rlib) for RadServer"

[lib]
name = "rad_version_26_3"
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
bytes = { workspace = true }
flate2 = { workspace = true }
rad-api = { path = "../../RadAPI", features = ["v1"] }
rad-core = { path = "../../RadCore", default-features = false }
rad-version = { path = "../common", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
wasmi = { workspace = true }
